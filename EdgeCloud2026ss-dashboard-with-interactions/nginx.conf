server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets for faster transfer
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; Vite fingerprints filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # WebSocket proxy to the MQTT->WS bridge. Serving the live stream over the
    # SAME origin/port as the dashboard means only port 8080 needs to be
    # reachable (e.g. forwarded over SSH) — no separate 8081 forward required,
    # which is where remote setups commonly drop the WebSocket frames.
    location /ws {
        proxy_pass http://host.docker.internal:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # TTS backend proxy, same reasoning as /ws above: the dashboard's JS bundle
    # only ever calls the same-origin relative path /api/tts/, so the Flask
    # server's actual host/port (and any LAN IP changes) never need to be
    # baked into the build or known by the browser.
    location /api/tts/ {
        proxy_pass http://host.docker.internal:5005/api/tts/;
        proxy_set_header Host $host;
    }

    # Single Page Application: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
