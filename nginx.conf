server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip text assets for faster transfer
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively; Vite fingerprints filenames
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single Page Application: fall back to index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the entry HTML so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
