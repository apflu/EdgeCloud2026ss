services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edgecloud-mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  app:
    build: ./app
    container_name: edgecloud-app
    depends_on:
      - mosquitto
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/edgecloud.log
    restart: unless-stopped

  # Bridges MQTT patient observations to a plain WebSocket the browser
  # dashboard (EdgeCloud) can consume via its VITE_WS_URL setting.
  bridge:
    build: ./bridge
    container_name: edgecloud-bridge
    depends_on:
      - mosquitto
    ports:
      # Host 8081 -> WebSocket server inside the container. The dashboard's
      # VITE_WS_URL must point here (ws://localhost:8081).
      - "8081:8081"
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - OBSERVATION_TOPIC=edge/observations/room/101
      - WS_HOST=0.0.0.0
      - WS_PORT=8081
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
