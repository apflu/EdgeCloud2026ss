# Raw TCP MQTT — used by the ESP32 devices, the simulators and the bridge.
listener 1883

# WebSocket MQTT — port 9001 is published in docker-compose; without this
# listener it would refuse connections. Enables MQTT-over-WS clients
# (e.g. a browser using mqtt.js) to talk to the broker directly.
listener 9001
protocol websockets

allow_anonymous true
persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
